<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; img-src 'self' file: data:; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <title>AETHER — PARMAR</title>
    <link rel="stylesheet" href="./browser.css">
    <script src="./browser-renderer.cjs" defer></script>
  </head>
  <body>
    <main class="browser-shell">
      <header class="topbar">
        <div class="brand">
          <img class="brand-mark" id="brand-emblem" alt="" aria-hidden="true">
          <span><strong>AETHER</strong><small>by PARMAR</small></span>
        </div>
        <nav class="tab-strip" aria-label="Browser tabs">
          <div class="tabs" id="tabs" role="tablist" aria-label="Open pages"></div>
          <button class="tab-add" type="button" data-action="new-tab" aria-label="New tab" title="New tab (Ctrl+T)">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
          </button>
        </nav>
        <div class="security-state" id="security-state" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Checking restricted mode</span>
        </div>
        <button class="icon-button" type="button" data-action="settings" aria-label="Browser settings" title="Browser settings">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.1 2.7 8.5 1h3l.4 1.7 1.5.9 1.7-.5 1.5 2.6-1.3 1.2v1.8l1.3 1.2-1.5 2.6-1.7-.5-1.5.9-.4 1.7h-3l-.4-1.7-1.5-.9-1.7.5-1.5-2.6 1.3-1.2V6.9L3.4 5.7l1.5-2.6 1.7.5 1.5-.9Z"/><circle cx="10" cy="7.8" r="2.1"/></svg>
        </button>
      </header>

      <form class="toolbar" id="address-form" autocomplete="off">
        <button class="icon-button" type="button" data-action="back" aria-label="Back" title="Back (Alt+Left)" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11.8 4 6 10l5.8 6M6.5 10H16"/></svg>
        </button>
        <button class="icon-button" type="button" data-action="forward" aria-label="Forward" title="Forward (Alt+Right)" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8.2 4 5.8 6-5.8 6m5.3-6H4"/></svg>
        </button>
        <button class="icon-button" type="button" data-action="reload" aria-label="Reload" title="Reload (Ctrl+R)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 8a6.2 6.2 0 0 0-10.7-2L4 7.5M4 4v3.5h3.5M4 12a6.2 6.2 0 0 0 10.7 2L16 12.5M16 16v-3.5h-3.5"/></svg>
        </button>
        <button class="icon-button" type="button" data-action="stop" aria-label="Stop loading" title="Stop" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5.5" y="5.5" width="9" height="9" rx="1"/></svg>
        </button>
        <label class="address-box">
          <svg class="address-lock" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.7" cy="8.7" r="5.1"/><path d="m12.5 12.5 4 4"/></svg>
          <span class="sr-only">Address or search</span>
          <input id="address" name="address" type="text" inputmode="url" placeholder="Enter an address or search" aria-label="Address or search">
          <button class="address-go" type="submit" aria-label="Go to address">Go</button>
        </label>
        <button class="icon-button" type="button" data-action="bookmark" aria-label="Bookmark this page" title="Bookmark this page" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 3.5h9v13l-4.5-3-4.5 3z"/></svg>
        </button>
      </form>

      <section class="restricted-notice" id="restricted-notice" role="status" aria-live="polite">
        Remote browsing is disabled because this installation has no verified operating-system network boundary.
      </section>

      <section class="workspace" aria-label="Browser content">
        <nav class="sidebar" aria-label="Browser shortcuts">
          <div class="sidebar-group">
            <span class="sidebar-label">Workspace</span>
            <button class="sidebar-action" type="button" data-action="new-tab" aria-label="Home, open a new AETHER tab">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m3.5 9 6.5-5.5L16.5 9v7.5h-5v-5h-3v5h-5z"/></svg>
              <span>Home</span>
            </button>
            <button class="sidebar-action" type="button" data-action="focus-address" aria-label="Search, focus address bar">
              <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.7" cy="8.7" r="5.1"/><path d="m12.5 12.5 4 4"/></svg>
              <span>Search</span>
            </button>
          </div>
          <div class="sidebar-group">
            <span class="sidebar-label">Library</span>
            <button class="sidebar-action" type="button" data-action="bookmarks" aria-label="Saved bookmarks">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5.5h8M4 9h8M4 12.5h5"/><path d="M13 4.5h3v12l-3-2-3 2v-3"/></svg>
              <span>Bookmarks</span>
            </button>
            <button class="sidebar-action" type="button" data-action="history" aria-label="Browsing history">
              <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 5.5v4.8l3.1 1.8"/></svg>
              <span>History</span>
            </button>
            <button class="sidebar-action" type="button" data-action="downloads" aria-label="Downloads">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.5v9m-3.5-3.5L10 12.5l3.5-3.5M4.5 15.5v1h11v-1"/></svg>
              <span>Downloads</span>
            </button>
          </div>
        </nav>
        <div class="viewport" id="viewport" aria-label="Web page"></div>
        <aside class="side-panel" id="side-panel" aria-labelledby="panel-title" hidden>
          <div class="panel-heading">
            <h2 id="panel-title">Browser panel</h2>
            <button class="icon-button" type="button" data-action="close-panel" aria-label="Close panel">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
            </button>
          </div>
          <div id="panel-content"></div>
        </aside>
      </section>
      <footer class="statusbar">
        <span id="tab-state" role="status" aria-live="polite">No browser tab selected</span>
        <span class="statusbar-right">Chromium · PARMAR safety boundary required</span>
      </footer>
    </main>
  </body>
</html>
