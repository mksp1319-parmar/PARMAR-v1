<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'"
    >
    <title>PARMAR Desktop — Control plane unavailable</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, "Segoe UI", sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px; color: #f5f0e8; background: #111116; }
      main { width: min(620px, 100%); padding: 32px; border: 1px solid #51402e; border-radius: 20px; background: #19181a; }
      span { color: #d3a36d; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }
      h1 { font-weight: 500; }
      p { color: #c4beb6; line-height: 1.7; }
      code { color: #ebc99e; }
      button { padding: 12px 18px; border: 1px solid #9b6a38; border-radius: 10px; color: #f5f0e8; background: #3a2a1d; cursor: pointer; }
      button:focus-visible { outline: 2px solid #e4b87f; outline-offset: 3px; }
    </style>
    <script src="./control-unavailable.cjs" defer></script>
  </head>
  <body>
    <main>
      <span>PARMAR DESKTOP</span>
      <h1>The PARMAR control plane is unavailable.</h1>
      <p>Start the existing Python server on its loopback interface, then restart this desktop app. The desktop shell will not connect to a remote or arbitrary backend.</p>
      <p><code>python -m PARMAR.interface.futuristic_app</code></p>
      <p id="aether-desktop-status" role="status" aria-live="polite"></p>
      <button id="open-aether" type="button">Open restricted AETHER shell</button>
    </main>
  </body>
</html>
