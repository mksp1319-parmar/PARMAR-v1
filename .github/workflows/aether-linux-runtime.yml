name: AETHER Linux runtime verification

on:
  pull_request:
    paths:
      - ".github/workflows/aether-linux-runtime.yml"
      - "PARMAR/desktop/**"
      - "PARMAR/interface/static/assets/parmar-emblem.png"
  push:
    paths:
      - ".github/workflows/aether-linux-runtime.yml"
      - "PARMAR/desktop/**"
      - "PARMAR/interface/static/assets/parmar-emblem.png"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-electron-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: PARMAR/desktop/package-lock.json

      - name: Install runner-local Electron and screenshot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            at-spi2-core \
            fonts-liberation \
            iproute2 \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libatspi2.0-0 \
            libbrotli1 \
            libbsd0 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libexpat1 \
            libfuse2t64 \
            libgbm1 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            libxrender1 \
            libxshmfence1 \
            libxss1 \
            libxtst6 \
            xauth \
            xdotool \
            xvfb \
            imagemagick
          test -x /usr/bin/unshare
          test -x /usr/bin/setpriv
          test -x /usr/sbin/ip
          unshare --user --map-current-user --net true
          test -e /usr/lib/x86_64-linux-gnu/libgtk-3.so.0
          test -e /usr/lib/x86_64-linux-gnu/libatk-1.0.so.0
          test -e /usr/lib/x86_64-linux-gnu/libgbm.so.1
          test -e /usr/lib/x86_64-linux-gnu/libxkbcommon.so.0

      - name: Install pinned desktop dependencies
        working-directory: PARMAR/desktop
        run: npm ci

      - name: Build unpacked and AppImage packages
        working-directory: PARMAR/desktop
        run: |
          npm run package:dir
          npm run package:linux

      - name: Run full suite and packaged AppImage UI smoke test
        working-directory: PARMAR/desktop
        env:
          PARMAR_ELECTRON_RUNTIME_LIB_DIR: /usr/lib/x86_64-linux-gnu
          PARMAR_ELECTRON_RUNTIME_REQUIRED: "1"
          PARMAR_AETHER_UI_SMOKE: "1"
          PARMAR_AETHER_UI_SMOKE_REQUIRED: "1"
          PARMAR_AETHER_UI_SCREENSHOT_DIR: ${{ runner.temp }}/aether-ui-screenshots
        run: npm test

      - name: Run Electron and Chromium isolation integration test
        working-directory: PARMAR/desktop
        env:
          PARMAR_ELECTRON_RUNTIME_LIB_DIR: /usr/lib/x86_64-linux-gnu
          PARMAR_ELECTRON_RUNTIME_REQUIRED: "1"
        run: npm run test:electron-isolation

      - name: Upload AETHER runtime screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-linux-runtime-screenshots
          path: ${{ runner.temp }}/aether-ui-screenshots/
          if-no-files-found: warn
          retention-days: 14
