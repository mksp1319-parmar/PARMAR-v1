name: AETHER Linux runtime verification

on:
  pull_request:
    paths:
      - ".github/workflows/aether-linux-runtime.yml"
      - ".github/scripts/**"
      - "PARMAR/desktop/**"
      - "PARMAR/interface/static/assets/parmar-emblem.png"
  push:
    paths:
      - ".github/workflows/aether-linux-runtime.yml"
      - ".github/scripts/**"
      - "PARMAR/desktop/**"
      - "PARMAR/interface/static/assets/parmar-emblem.png"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-electron-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare fresh package and evidence directories
        id: outputs
        shell: bash
        run: |
          evidence_dir="$(mktemp -d "${RUNNER_TEMP}/aether-evidence.XXXXXX")"
          package_dir="$(mktemp -d "${RUNNER_TEMP}/aether-packages.XXXXXX")"
          mkdir -p \
            "$evidence_dir/focused-probe" \
            "$evidence_dir/focused-ui" \
            "$evidence_dir/full-suite"
          {
            printf 'Evidence directory: %s\n' "$evidence_dir"
            printf 'Package directory: %s\n' "$package_dir"
            printf 'Runner kernel: %s\n' "$(uname -a)"
            printf 'Runner UID/GID: %s/%s\n' "$(id -u)" "$(id -g)"
          } | tee "$evidence_dir/ci-setup.log"
          echo "evidence_dir=$evidence_dir" >> "$GITHUB_OUTPUT"
          echo "package_dir=$package_dir" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: PARMAR/desktop/package-lock.json

      - name: Install runner-local Electron and screenshot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            at-spi2-core \
            fonts-liberation \
            iproute2 \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libatspi2.0-0 \
            libbrotli1 \
            libbsd0 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libexpat1 \
            libfuse2t64 \
            libgbm1 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            perl \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            libxrender1 \
            libxshmfence1 \
            libxss1 \
            libxtst6 \
            xauth \
            xdotool \
            xvfb \
            imagemagick

      - name: Diagnose Linux namespace prerequisites
        shell: bash
        env:
          AETHER_EVIDENCE_DIR: ${{ steps.outputs.outputs.evidence_dir }}
        run: |
          set -o pipefail
          {
            echo "Runner kernel: $(uname -a)"
            printf 'Runner UID/GID: %s/%s\n' "$(id -u)" "$(id -g)"
            for setting in \
              /proc/sys/kernel/apparmor_restrict_unprivileged_userns \
              /proc/sys/kernel/apparmor_restrict_unprivileged_unconfined \
              /proc/sys/kernel/unprivileged_userns_clone \
              /proc/sys/user/max_user_namespaces \
              /proc/self/attr/current; do
              if [[ -r "$setting" ]]; then
                printf '%s: ' "$setting"
                cat "$setting"
              else
                printf '%s: unavailable\n' "$setting"
              fi
            done
            for setting in \
              /proc/self/uid_map \
              /proc/self/gid_map \
              /proc/self/ns/user \
              /proc/self/ns/net; do
              if [[ -r "$setting" ]]; then
                printf '%s: ' "$setting"
                if [[ "$setting" == /proc/self/ns/* ]]; then
                  readlink "$setting" || echo "unavailable"
                else
                  cat "$setting" || echo "unavailable"
                fi
              else
                printf '%s: unavailable\n' "$setting"
              fi
            done

            missing=0
            for tool in /usr/bin/unshare /usr/bin/setpriv /usr/sbin/ip; do
              if [[ -x "$tool" ]]; then
                printf 'Available namespace tool: %s\n' "$tool"
              else
                printf 'Missing required namespace tool: %s\n' "$tool"
                missing=1
              fi
            done
            if [[ "$missing" -ne 0 ]]; then
              echo "Namespace tools are unavailable."
              exit 1
            fi
          } 2>&1 | tee "$AETHER_EVIDENCE_DIR/namespace-prerequisites.log"

      - name: Verify unprivileged network namespace creation
        shell: bash
        env:
          AETHER_EVIDENCE_DIR: ${{ steps.outputs.outputs.evidence_dir }}
        run: |
          bash .github/scripts/aether-namespace-preflight.sh \
            "$AETHER_EVIDENCE_DIR/network-namespace-check.log"

      - name: Verify Electron GUI runtime prerequisites
        shell: bash
        env:
          AETHER_EVIDENCE_DIR: ${{ steps.outputs.outputs.evidence_dir }}
        run: |
          set -o pipefail
          missing=0
          for tool in /usr/bin/Xvfb /usr/bin/xdotool /usr/bin/import /usr/bin/convert; do
            if [[ -x "$tool" ]]; then
              printf 'Available GUI/screenshot tool: %s\n' "$tool"
            else
              printf 'Missing required GUI/screenshot tool: %s\n' "$tool"
              missing=1
            fi
          done
          for library in \
            /usr/lib/x86_64-linux-gnu/libgtk-3.so.0 \
            /usr/lib/x86_64-linux-gnu/libatk-1.0.so.0 \
            /usr/lib/x86_64-linux-gnu/libgbm.so.1 \
            /usr/lib/x86_64-linux-gnu/libxkbcommon.so.0; do
            if [[ -e "$library" ]]; then
              printf 'Available Electron runtime library: %s\n' "$library"
            else
              printf 'Missing required Electron runtime library: %s\n' "$library"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Electron UI/screenshot runtime prerequisites are unavailable."
            exit 1
          fi
          dpkg-query -W -f='${binary:Package} ${Version}\n' \
            at-spi2-core fonts-liberation iproute2 libasound2t64 \
            libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libbrotli1 \
            libbsd0 libcairo2 libcups2 libdbus-1-3 libdrm2 libexpat1 \
            libfuse2t64 libgbm1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 \
            libpango-1.0-0 libpangocairo-1.0-0 libx11-xcb1 libxcomposite1 \
            libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 libxrender1 \
            libxshmfence1 libxss1 libxtst6 xauth xdotool xvfb imagemagick \
            | tee "$AETHER_EVIDENCE_DIR/gui-runtime-packages.log"

      - name: Install pinned desktop dependencies
        working-directory: PARMAR/desktop
        run: npm ci

      - name: Provision pinned Electron runtime and verify runtime libraries
        working-directory: PARMAR/desktop
        env:
          AETHER_EVIDENCE_DIR: ${{ steps.outputs.outputs.evidence_dir }}
        run: |
          set -o pipefail
          node node_modules/electron/install.js
          node scripts/verify-electron-runtime.cjs
          electron_binary="node_modules/electron/dist/electron"
          if ! ldd "$electron_binary" 2>&1 | tee "$AETHER_EVIDENCE_DIR/electron-runtime-libraries.log"; then
            echo "Could not inspect the pinned Electron runtime libraries."
            exit 1
          fi
          if grep -F 'not found' "$AETHER_EVIDENCE_DIR/electron-runtime-libraries.log"; then
            echo "One or more Electron shared-library dependencies are missing."
            exit 1
          fi
          runtime_library_cache="$(ldconfig -p)"
          for library in \
            libasound.so.2 libatk-bridge-2.0.so.0 libatk-1.0.so.0 libatspi.so.0 \
            libbrotlidec.so.1 libbrotlicommon.so.1 libbsd.so.0 libcairo.so.2 \
            libcups.so.2 libdbus-1.so.3 libdrm.so.2 libexpat.so.1 libfuse.so.2 \
            libgbm.so.1 libglib-2.0.so.0 libgtk-3.so.0 libnspr4.so libnss3.so \
            libpango-1.0.so.0 libpangocairo-1.0.so.0 libX11-xcb.so.1 \
            libXcomposite.so.1 libXdamage.so.1 libXfixes.so.3 libxkbcommon.so.0 \
            libXrandr.so.2 libXrender.so.1 libXshmfence.so.1 libXss.so.1 libXtst.so.6; do
            if ! grep -Fq "$library (" <<< "$runtime_library_cache"; then
              echo "Required Electron runtime library is not registered: $library"
              exit 1
            fi
          done
          for tool in /usr/bin/Xvfb /usr/bin/xdotool /usr/bin/import /usr/bin/convert; do
            test -x "$tool" || {
              echo "Required GUI/screenshot executable is missing: $tool"
              exit 1
            }
          done
          {
            node --version
            node -p "require('./node_modules/electron/package.json').version"
            node -p "require('./node_modules/electron-builder/package.json').version"
            /usr/bin/Xvfb -version 2>&1 | head -n 1
            /usr/bin/xdotool version
            /usr/bin/convert -version | head -n 1
          } | tee "$AETHER_EVIDENCE_DIR/runtime-tool-versions.log"
          node --test test/electron-runtime-provisioning.test.cjs
          node - <<'NODE' 2>&1 | tee "$AETHER_EVIDENCE_DIR/appimage-toolset.log"
          const { Arch } = require('builder-util');
          const { getAppImageTools } = require('app-builder-lib/out/toolsets/linux');

          getAppImageTools(undefined, Arch.x64).then((tools) => {
            for (const [name, executable] of Object.entries(tools)) {
              require('node:fs').accessSync(executable, require('node:fs').constants.X_OK);
              console.log(`${name}: ${executable}`);
            }
          }).catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Build fresh unpacked and AppImage packages without network access
        id: packages
        working-directory: PARMAR/desktop
        env:
          AETHER_EVIDENCE_DIR: ${{ steps.outputs.outputs.evidence_dir }}
        run: |
          set -o pipefail
          package_dir="${{ steps.outputs.outputs.package_dir }}"
          run_isolated() {
            /usr/bin/unshare --user --map-current-user --net --fork --kill-child=SIGKILL -- \
              /usr/bin/setpriv --no-new-privs -- /usr/bin/env \
              -u ALL_PROXY -u HTTP_PROXY -u HTTPS_PROXY -u NO_PROXY -u SOCKS_PROXY \
              -u all_proxy -u http_proxy -u https_proxy -u no_proxy -u socks_proxy \
              -u npm_config_proxy -u npm_config_http_proxy -u npm_config_https_proxy "$@"
          }
          run_isolated npm run package:dir -- \
            --config.directories.output="$package_dir" \
            --config.electronDist="$PWD/node_modules/electron/dist" \
            2>&1 | tee "$AETHER_EVIDENCE_DIR/package-directory-build.log"
          run_isolated npm run package:linux -- \
            --config.directories.output="$package_dir" \
            --config.electronDist="$PWD/node_modules/electron/dist" \
            2>&1 | tee "$AETHER_EVIDENCE_DIR/package-appimage-build.log"
          test -x "$package_dir/linux-unpacked/parmar-aether-desktop"
          test -f "$package_dir/linux-unpacked/resources/app.asar"
          test -x "$package_dir/PARMAR AETHER-1.0.0.AppImage"
          appimage="$package_dir/PARMAR AETHER-1.0.0.AppImage"
          extraction_directory="$package_dir/appimage-inspection"
          mkdir -p "$extraction_directory"
          (
            cd "$extraction_directory"
            run_isolated "$appimage" --appimage-extract
          ) 2>&1 | tee "$AETHER_EVIDENCE_DIR/appimage-extraction.log"
          appimage_root="$extraction_directory/squashfs-root"
          test -d "$appimage_root"
          for package_root in "$package_dir/linux-unpacked" "$appimage_root"; do
            archive="$(find "$package_root" -type f -path '*/resources/app.asar' -print -quit)"
            test -n "$archive"
            resources_directory="$(dirname "$archive")"
            test -f "$resources_directory/aether/parmar-emblem.png"
            cmp ../interface/static/assets/parmar-emblem.png \
              "$resources_directory/aether/parmar-emblem.png"
            node - "$archive" <<'NODE'
          const assert = require('node:assert/strict');
          const asar = require('@electron/asar');
          const archive = process.argv[2];
          const files = new Set(asar.listPackage(archive));
          for (const required of [
            '/main.cjs',
            '/broker-protocol.cjs',
            '/browser-child-broker.cjs',
            '/browser-child-supervisor.cjs',
            '/browser-preload.cjs',
            '/browser-renderer.cjs',
            '/browser.css',
            '/browser.html',
            '/control-preload.cjs',
            '/control-unavailable.cjs',
            '/control-unavailable.html',
            '/isolation-launcher.cjs',
            '/isolation-probe.cjs',
            '/newtab.html',
            '/package.json',
            '/security.cjs',
            '/store.cjs',
          ]) {
            assert.ok(files.has(required), `${archive} omits ${required}`);
          }
          console.log(`Verified ${files.size} ASAR entries in ${archive}`);
          NODE
          done
          file "$appimage" | tee "$AETHER_EVIDENCE_DIR/appimage-file.log"
          sha256sum "$appimage" | tee "$AETHER_EVIDENCE_DIR/appimage-sha256.log"
          echo "linux_directory=$package_dir/linux-unpacked" >> "$GITHUB_OUTPUT"

      - name: Run focused packaged production-child probe
        working-directory: PARMAR/desktop
        env:
          AETHER_EVIDENCE_DIR: ${{ steps.outputs.outputs.evidence_dir }}
          PARMAR_AETHER_LINUX_DIR_PATH: ${{ steps.packages.outputs.linux_directory }}
          PARMAR_AETHER_PRODUCTION_CHILD_PROBE_REQUIRED: "1"
          PARMAR_AETHER_UI_SCREENSHOT_DIR: ${{ steps.outputs.outputs.evidence_dir }}/focused-probe
        run: |
          set -o pipefail
          /usr/bin/env \
            -u ALL_PROXY -u HTTP_PROXY -u HTTPS_PROXY -u NO_PROXY -u SOCKS_PROXY \
            -u all_proxy -u http_proxy -u https_proxy -u no_proxy -u socks_proxy \
            -u npm_config_proxy -u npm_config_http_proxy -u npm_config_https_proxy \
            npm run test:production-child-network-probe \
            2>&1 | tee "$AETHER_EVIDENCE_DIR/focused-probe/test.log"

      - name: Run focused packaged AppImage UI smoke test
        working-directory: PARMAR/desktop
        env:
          AETHER_EVIDENCE_DIR: ${{ steps.outputs.outputs.evidence_dir }}
          PARMAR_AETHER_APPIMAGE_PATH: ${{ steps.outputs.outputs.package_dir }}/PARMAR AETHER-1.0.0.AppImage
          PARMAR_AETHER_UI_SMOKE: "1"
          PARMAR_AETHER_UI_SMOKE_REQUIRED: "1"
          PARMAR_AETHER_UI_SCREENSHOT_DIR: ${{ steps.outputs.outputs.evidence_dir }}/focused-ui
        run: |
          set -o pipefail
          /usr/bin/env \
            -u ALL_PROXY -u HTTP_PROXY -u HTTPS_PROXY -u NO_PROXY -u SOCKS_PROXY \
            -u all_proxy -u http_proxy -u https_proxy -u no_proxy -u socks_proxy \
            -u npm_config_proxy -u npm_config_http_proxy -u npm_config_https_proxy \
            node --test test/electron-ui-smoke.test.cjs \
            2>&1 | tee "$AETHER_EVIDENCE_DIR/focused-ui/test.log"

      - name: Run focused isolation and supervisor regressions
        working-directory: PARMAR/desktop
        env:
          PARMAR_ELECTRON_RUNTIME_LIB_DIR: /usr/lib/x86_64-linux-gnu
          PARMAR_ELECTRON_RUNTIME_REQUIRED: "1"
          AETHER_EVIDENCE_DIR: ${{ steps.outputs.outputs.evidence_dir }}
        run: |
          set -o pipefail
          /usr/bin/env \
            -u ALL_PROXY -u HTTP_PROXY -u HTTPS_PROXY -u NO_PROXY -u SOCKS_PROXY \
            -u all_proxy -u http_proxy -u https_proxy -u no_proxy -u socks_proxy \
            -u npm_config_proxy -u npm_config_http_proxy -u npm_config_https_proxy \
            node --test --test-concurrency=1 \
              test/browser-child.test.cjs \
              test/isolation-prototype.test.cjs \
            2>&1 | tee "$AETHER_EVIDENCE_DIR/isolation-unit-tests.log"
          /usr/bin/env \
            -u ALL_PROXY -u HTTP_PROXY -u HTTPS_PROXY -u NO_PROXY -u SOCKS_PROXY \
            -u all_proxy -u http_proxy -u https_proxy -u no_proxy -u socks_proxy \
            -u npm_config_proxy -u npm_config_http_proxy -u npm_config_https_proxy \
            npm run test:electron-isolation \
            2>&1 | tee "$AETHER_EVIDENCE_DIR/electron-isolation-tests.log"

      - name: Run complete serial desktop regression suite
        working-directory: PARMAR/desktop
        env:
          PARMAR_ELECTRON_RUNTIME_LIB_DIR: /usr/lib/x86_64-linux-gnu
          PARMAR_ELECTRON_RUNTIME_REQUIRED: "1"
          PARMAR_AETHER_UI_SMOKE: "1"
          PARMAR_AETHER_UI_SMOKE_REQUIRED: "1"
          PARMAR_AETHER_APPIMAGE_PATH: ${{ steps.outputs.outputs.package_dir }}/PARMAR AETHER-1.0.0.AppImage
          PARMAR_AETHER_UI_SCREENSHOT_DIR: ${{ steps.outputs.outputs.evidence_dir }}/full-suite
          PARMAR_AETHER_LINUX_DIR_PATH: ${{ steps.packages.outputs.linux_directory }}
          PARMAR_AETHER_PRODUCTION_CHILD_PROBE_REQUIRED: "1"
          AETHER_EVIDENCE_DIR: ${{ steps.outputs.outputs.evidence_dir }}
        run: |
          set -o pipefail
          /usr/bin/env \
            -u ALL_PROXY -u HTTP_PROXY -u HTTPS_PROXY -u NO_PROXY -u SOCKS_PROXY \
            -u all_proxy -u http_proxy -u https_proxy -u no_proxy -u socks_proxy \
            -u npm_config_proxy -u npm_config_http_proxy -u npm_config_https_proxy \
            npm test 2>&1 | tee "$AETHER_EVIDENCE_DIR/full-suite/test.log"

      - name: Upload AETHER runtime evidence and screenshots
        if: always() && steps.outputs.outputs.evidence_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: aether-linux-runtime-evidence
          path: ${{ steps.outputs.outputs.evidence_dir }}/
          if-no-files-found: error
          retention-days: 14
