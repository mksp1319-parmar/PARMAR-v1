name: AETHER Android SQLite instrumentation

on:
  pull_request:
    paths:
      - ".github/workflows/aether-android-sqlite-instrumentation.yml"
      - "PARMAR/android/**"
      - "PARMAR/interface/static/assets/parmar-emblem.png"
  push:
    paths:
      - ".github/workflows/aether-android-sqlite-instrumentation.yml"
      - "PARMAR/android/**"
      - "PARMAR/interface/static/assets/parmar-emblem.png"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-instrumentation:
    name: SQLite instrumentation (API 35)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            PARMAR/android/**/*.gradle*
            PARMAR/android/gradle/libs.versions.toml
            PARMAR/android/gradle/wrapper/gradle-wrapper.properties

      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
            platform-tools

      - name: Enable KVM for the hosted emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real SQLite instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -camera-back none
          emulator-boot-timeout: 600
          working-directory: PARMAR/android
          script: |
            mkdir -p artifacts
            trap 'status=$?; adb logcat -d > artifacts/emulator-logcat.txt 2>&1 || true; exit "$status"' EXIT
            adb logcat -c
            adb devices -l
            ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Retain instrumentation reports and emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-sqlite-instrumentation-results
          path: |
            PARMAR/android/artifacts/**
            PARMAR/android/app/build/reports/androidTests/connected/**
            PARMAR/android/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14
