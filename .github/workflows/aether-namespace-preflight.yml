name: AETHER hosted namespace preflight candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  namespace-preflight:
    name: Namespace preflight (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Perl preflight dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y perl

      - name: Verify rootless user and network namespaces
        shell: bash
        env:
          AETHER_EVIDENCE_DIR: ${{ runner.temp }}/aether-namespace-${{ matrix.runner }}
        run: |
          mkdir -p "$AETHER_EVIDENCE_DIR"
          bash .github/scripts/aether-namespace-preflight.sh \
            "$AETHER_EVIDENCE_DIR/network-namespace-check.log"

      - name: Upload namespace preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-namespace-preflight-${{ matrix.runner }}
          path: ${{ runner.temp }}/aether-namespace-${{ matrix.runner }}/network-namespace-check.log
          if-no-files-found: error
          retention-days: 14
