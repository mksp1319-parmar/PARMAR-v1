name: PARMAR specialist approval integrity

on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: specialist-approval-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-formal-approvals:
    name: Validate formal specialist approval records
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate approval register
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/validate-specialist-approvals.py
